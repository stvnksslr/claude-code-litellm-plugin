name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same toolchain source as the release job (mise.toml), so CI tests
      # exactly what GoReleaser ships. Also installs the pinned golangci-lint.
      - name: mise install
        uses: jdx/mise-action@v5

      - name: Go version pins agree
        run: |
          MOD=$(awk '$1 == "go" { print $2 }' go.mod)
          MISE=$(mise current go)
          if [ "$MOD" != "$MISE" ]; then
            echo "go.mod go line ($MOD) != mise.toml go ($MISE); update both"
            exit 1
          fi

      - name: go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

      - name: golangci-lint
        run: golangci-lint run

      - name: go test
        run: go test -v -count=1 ./...

      - name: examples.svg is up to date
        run: |
          if ! git diff --exit-code examples.svg; then
            echo "examples.svg changed: run 'mise run test' and commit it"
            exit 1
          fi

      - name: Installer scripts
        run: |
          bash -n install.sh
          shellcheck install.sh release.sh

  # The binary has macOS (Keychain) and Windows (paths, PATH lookup) code paths.
  test-other-os:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: go
      - run: go test -count=1 ./...

  # Builds everything a release would (binaries, .vsix, IntelliJ zip, checksums,
  # brew/scoop manifests) without publishing, so release breakage shows up here.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: goreleaser check
        run: goreleaser check
      # Snapshots never run the brew/scoop publishers, so their token template is
      # unchecked there; GoReleaser only accepts exactly '{{ .Env.NAME }}'.
      - name: Publisher tokens are plain env references
        run: |
          bad=$(grep -nE '^\s*token:' .goreleaser.yaml | grep -vE "token: '\{\{ \.Env\.[A-Za-z0-9_]+ \}\}'$" || true)
          if [ -n "$bad" ]; then echo "token must be exactly '{{ .Env.NAME }}':"; echo "$bad"; exit 1; fi
      - name: Snapshot release
        run: mise run release:snapshot
      # A real (non-snapshot) release refuses a dirty tree; snapshots don't check.
      - name: Release build leaves the tree clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "release:artifacts/goreleaser modified tracked files:"; git status --porcelain; exit 1
          fi
