name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same toolchain source as the release job (mise.toml), so CI tests
      # exactly what GoReleaser ships. Also installs the pinned golangci-lint.
      - name: mise install
        uses: jdx/mise-action@v2

      - name: Go version pins agree
        run: |
          MOD=$(awk '$1 == "go" { print $2 }' go.mod)
          MISE=$(mise current go)
          if [ "$MOD" != "$MISE" ]; then
            echo "go.mod go line ($MOD) != mise.toml go ($MISE); update both"
            exit 1
          fi

      - name: go fmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -d .
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy'"
            git diff go.mod go.sum
            exit 1
          fi

      - name: golangci-lint
        run: golangci-lint run

      - name: go test
        run: go test -v ./...

  vscode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mise install
        uses: jdx/mise-action@v2

      - name: Install and build VS Code extension
        working-directory: vscode-extension
        run: |
          npm ci
          npm run compile
          npm run package

  intellij:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: mise install
        uses: jdx/mise-action@v2

      - name: Build IntelliJ plugin
        working-directory: intellij-plugin
        run: ./gradlew buildPlugin --console=plain
