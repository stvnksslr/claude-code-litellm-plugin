name: Release

# release.sh pushes the tag. One job does everything in order, so the GitHub
# release only becomes visible once every asset is uploaded: GoReleaser creates
# it as a draft, uploads binaries + .vsix + IntelliJ zip + checksums, publishes
# it, and only then updates the Homebrew tap / Scoop bucket.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: mise install
        uses: jdx/mise-action@v5

      - name: go test
        run: go test -count=1 ./...

      - name: Build editor plugins (version-stamped)
        run: mise run release:artifacts "${GITHUB_REF_NAME}"

      - name: GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on stvnksslr/homebrew-tap and
          # stvnksslr/scoop-bucket. When unset, the tap/bucket update is skipped.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
